version: 2

# Two ecosystems matter here:
#
#   npm            — the extension's runtime deps ship inside the bundles
#                    that go to the extension stores, so an advisory here
#                    reaches installed users.
#   github-actions — the workflow actions are pinned to full commit SHAs
#                    (see .github/workflows/ci.yml). Pinning is only safe
#                    if something bumps the pins; that something is this.
#
# Grouped so a quiet week produces one PR, not six.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
