version: 2

# Two ecosystems matter here:
#
#   npm            — the extension's runtime deps ship inside the bundles
#                    that go to the extension stores, so an advisory here
#                    reaches installed users.
#   github-actions — the workflow actions are pinned to full commit SHAs
#                    (see .github/workflows/ci.yml). Pinning is only safe
#                    if something bumps the pins; that something is this.
#
# Grouped so a quiet week produces one PR, not six.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Split by dependency type so a runtime bump (readability, pdfjs-dist,
      # turndown — they ship inside the bundles) never rides in the same PR
      # as a devDependency bump: the dev group auto-merges on green
      # (.github/workflows/dependabot-automerge.yml), the runtime group is
      # reviewed by a human with the browser smoke and a PDF capture.
      npm-dev-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      npm-runtime-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
