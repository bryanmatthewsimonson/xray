# The JOURNAL index heals itself on main — RESET_PLAN §7 R0, "Split the
# JOURNAL now, not in R6".
#
# Two PRs that each append to the same month and each regenerate
# docs/JOURNAL.md merge cleanly under `merge=union` (.gitattributes) —
# but the union keeps both sides' index lines in merge order while the
# generator sorts newest-first, so main can land with a STALE index (the
# drift guard in tests/journal-index.test.mjs red) after two
# individually green PRs. Roughly half the pairs, by date order. No PR
# check can see the merge that has not happened yet; this job runs on
# the push that is that merge. It also moves any stray a merged
# pre-split PR left in the index.
#
# The generator has zero dependencies, so there is no `npm ci`; the
# journal test file imports only node builtins and the generator, so it
# runs here too, on the tree the job is about to commit.
#
# A generator refusal (unrecognised text, an entry amended in the index)
# fails this job with the offending lines in the log — main then needs a
# hand fix, in a PR; nothing is discarded. If main is ever protected
# against direct pushes, the `git push` fails and the job goes red: a
# loud stale index, never a silent one. A push made with GITHUB_TOKEN
# starts no further workflow run, so the regen commit cannot loop — and
# CI does not run on it either; the next PR's CI covers the tree.
name: journal index

on:
  push:
    branches: [main]
    paths:
      - docs/JOURNAL.md
      - docs/journal/**
      - tools/gen-journal-index.mjs

permissions:
  contents: write        # the regen commit

concurrency:
  group: journal-index
  cancel-in-progress: false

jobs:
  regen:
    name: regenerate docs/JOURNAL.md after a merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: regenerate (moves strays, rewrites the index; refuses rather than discards)
        run: npm run docs:journal

      - name: journal guards on the regenerated tree
        run: node --test tests/journal-index.test.mjs

      - name: commit and push when the index or a monthly file changed
        run: |
          if git diff --quiet -- docs/JOURNAL.md docs/journal; then
            echo "docs/JOURNAL.md is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/JOURNAL.md docs/journal
          git commit -m "docs(journal): regenerate the index after a merge" -m "tools/gen-journal-index.mjs on main, from .github/workflows/journal-index.yml — a union merge of two regenerated indexes keeps merge order; the generator sorts."
          git push
