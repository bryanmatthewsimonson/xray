name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: build + lint + package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Third-party actions are pinned to full commit SHAs, not tags: a tag
      # is mutable, and this repo's release job hands its build straight to
      # the extension stores. Dependabot (.github/dependabot.yml) bumps them.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Show versions
        # web-ext comes from the lockfile via `npm ci` — deliberately NOT a
        # `npm i -g web-ext@latest`, which would resolve fresh at run time
        # and bypass the lockfile for the tool that packages the extension.
        run: |
          node --version
          npx --no-install web-ext --version

      - name: Syntax-check source JS
        # Defence-in-depth: catches accidental syntax regressions in the
        # ES module sources before esbuild bundles them.
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find src -name '*.js' -type f)
          exit "$fail"

      - name: Build bundles (esbuild)
        run: npm run build

      - name: Run unit tests
        # The compgen guard predates the test suite (Phase 1 hadn't
        # landed tests/ yet); harmless now, keeps hypothetical
        # test-less branches green.
        run: |
          if compgen -G "tests/*.test.*" > /dev/null; then
            npm test
          else
            echo "No tests yet; skipping."
          fi

      - name: web-ext lint
        # Default: warnings non-fatal, errors fail the job.
        run: npx --no-install web-ext lint --source-dir . --self-hosted

      - name: web-ext build
        run: npx --no-install web-ext build --source-dir . --artifacts-dir web-ext-artifacts --overwrite-dest

      - name: Upload packaged extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-unpacked-${{ github.sha }}
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
