name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: build + lint + package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Third-party actions are pinned to full commit SHAs, not tags: a tag
      # is mutable, and this repo's release job hands its build straight to
      # the extension stores. Dependabot (.github/dependabot.yml) bumps them.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Show versions
        # web-ext comes from the lockfile via `npm ci` — deliberately NOT a
        # `npm i -g web-ext@latest`, which would resolve fresh at run time
        # and bypass the lockfile for the tool that packages the extension.
        run: |
          node --version
          npx --no-install web-ext --version

      - name: Syntax-check source JS
        # Defence-in-depth: catches accidental syntax regressions in the
        # ES module sources before esbuild bundles them.
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find src -name '*.js' -type f)
          exit "$fail"

      - name: Build bundles (esbuild)
        run: npm run build

      - name: Run unit tests
        # Was wrapped in `if compgen -G "tests/*.test.*"` until
        # 2026-08-09 (T3, ratified). That guard predated the suite and
        # kept a hypothetical test-less branch green — but ~2500 tests
        # now hang on that glob matching, so a directory rename would
        # have turned the project's primary safety net into
        # "No tests yet; skipping." under a green checkmark.
        run: npm test

      - name: Normalizer cross-language parity (reference side)
        # The extension ships a JavaScript twin of the companion's
        # providers/normalize.py (src/shared/provider-normalize.js),
        # because direct cloud transcription runs with no companion in
        # the loop. Both read tests/fixtures/normalizer-parity.json.
        #
        # npm test already checks the JS half and fails if normalize.py
        # is edited (it pins the reference's sha256) — but it can never
        # OBSERVE the Python behavior, so a fixture the reference no
        # longer satisfies would sail through. This step is that
        # observer.
        #
        # Deliberately NOT the companion's full suite: the companion is
        # not part of the extension build or zip, and its siblings
        # import yt-dlp/torch. The discover pattern is scoped to the one
        # pure-stdlib file, which needs no uv, no venv, and no install —
        # it runs on the runner's bare python3 in well under a second.
        working-directory: companion/transcriber
        run: python3 -m unittest discover -s tests -p 'test_shared_fixtures.py' -v

      - name: web-ext lint
        # Default: warnings non-fatal, errors fail the job.
        run: npx --no-install web-ext lint --source-dir . --self-hosted

      - name: web-ext build
        run: npx --no-install web-ext build --source-dir . --artifacts-dir web-ext-artifacts --overwrite-dest

      - name: Upload packaged extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xray-unpacked-${{ github.sha }}
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  browser-smoke:
    # The one observer of the layer no unit test executes: the built
    # bundles loaded as a real unpacked extension in headless Chromium.
    # `npm run smoke` runs each scenario in its own process group under a
    # hard timeout (tools/smoke/run.mjs). The launcher kills egress at the
    # browser level — every launch proxies non-loopback traffic to a dead
    # loopback port — and the walk additionally pins relays to
    # ws://127.0.0.1:1 before anything is clickable; the job's own
    # downloads (npm, Chromium, apt) happen before any browser starts
    # (docs/RESET_PLAN.md R0; docs/THREAT_MODEL.md 2026-09-07).
    #
    #   pages — every extension page loads, runs its init to the ready
    #           stamp, and throws nothing; product console.error fails it.
    #           REQUIRED from day one. Window: load → ready → 0.5 s settle.
    #   ma6   — the extraction-review / kind-30070 walk. ADVISORY (run and
    #           reported, never gating) until the flip. Flip criterion
    #           (JOURNAL 2026-09-07): on 2026-09-21, if ma6 has had ten
    #           green runs and every red run had a code cause, delete
    #           `--advisory=ma6` below in its own PR; otherwise record why
    #           and set a new date. Owner: the maintainer. "Required" for
    #           either scenario is also a branch-protection setting on
    #           main that only the maintainer can set.
    name: browser smoke
    # Pinned, not `ubuntu-latest`: Playwright's registry knows a fixed set
    # of Ubuntu releases and `--with-deps` fails on one it does not know.
    # Bump the image only together with the playwright devDependency.
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build bundles (esbuild)
        run: npm run build

      - name: Install Chromium for Playwright
        # The full Chromium, not headless_shell: only the full build can
        # load an extension. The revision is pinned by the playwright
        # devDependency's exact version in package.json — and Dependabot's
        # weekly devDependency group rolls that pin, so a smoke failure on
        # a `chore(deps-dev)` PR is a browser-roll finding, reviewed as
        # such, never a flake. Measured 2026-09-07: ~25 s.
        run: npx --no-install playwright install --with-deps chromium

      - name: Browser smoke
        run: npm run smoke -- --advisory=ma6

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ github.sha }}
          path: tools/smoke/out/
          if-no-files-found: warn
          retention-days: 14
