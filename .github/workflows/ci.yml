name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: build + lint + package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Third-party actions are pinned to full commit SHAs, not tags: a tag
      # is mutable, and this repo's release job hands its build straight to
      # the extension stores. Dependabot (.github/dependabot.yml) bumps them.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Show versions
        # web-ext comes from the lockfile via `npm ci` — deliberately NOT a
        # `npm i -g web-ext@latest`, which would resolve fresh at run time
        # and bypass the lockfile for the tool that packages the extension.
        run: |
          node --version
          npx --no-install web-ext --version

      - name: Syntax-check source JS
        # Defence-in-depth: catches accidental syntax regressions in the
        # ES module sources before esbuild bundles them.
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find src -name '*.js' -type f)
          exit "$fail"

      - name: Build bundles (esbuild)
        run: npm run build

      - name: Run unit tests
        # Was wrapped in `if compgen -G "tests/*.test.*"` until
        # 2026-08-09 (T3, ratified). That guard predated the suite and
        # kept a hypothetical test-less branch green — but ~2500 tests
        # now hang on that glob matching, so a directory rename would
        # have turned the project's primary safety net into
        # "No tests yet; skipping." under a green checkmark.
        run: npm test

      - name: Normalizer cross-language parity (reference side)
        # The extension ships a JavaScript twin of the companion's
        # providers/normalize.py (src/shared/provider-normalize.js),
        # because direct cloud transcription runs with no companion in
        # the loop. Both read tests/fixtures/normalizer-parity.json.
        #
        # npm test already checks the JS half and fails if normalize.py
        # is edited (it pins the reference's sha256) — but it can never
        # OBSERVE the Python behavior, so a fixture the reference no
        # longer satisfies would sail through. This step is that
        # observer.
        #
        # Deliberately NOT the companion's full suite: the companion is
        # not part of the extension build or zip, and its siblings
        # import yt-dlp/torch. The discover pattern is scoped to the one
        # pure-stdlib file, which needs no uv, no venv, and no install —
        # it runs on the runner's bare python3 in well under a second.
        working-directory: companion/transcriber
        run: python3 -m unittest discover -s tests -p 'test_shared_fixtures.py' -v

      - name: web-ext lint
        # Default: warnings non-fatal, errors fail the job.
        run: npx --no-install web-ext lint --source-dir . --self-hosted

      - name: web-ext build
        run: npx --no-install web-ext build --source-dir . --artifacts-dir web-ext-artifacts --overwrite-dest

      - name: Upload packaged extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xray-unpacked-${{ github.sha }}
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
