name: Release

# Fires when a `v*` tag is pushed (e.g. `v0.3.0`). Builds the
# extension, packages it via web-ext, and creates a GitHub Release
# with the .zip artifact attached. Manual dispatch is also supported
# for re-running on an existing tag if a previous run was botched.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.3.0"
        required: true

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    name: build + package + release
    runs-on: ubuntu-latest
    # The `release` environment carries a required reviewer, so a `v*` tag
    # push cannot mint a release artifact unattended — the .zip this job
    # produces is what gets uploaded to the extension stores.
    environment: release
    timeout-minutes: 10

    steps:
      # Pinned to full commit SHAs — see the note in ci.yml.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_dispatch needs to check out the tag explicitly;
          # tag-push is already at the right ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json + manifest.json versions agree
        # Both files carry the version. They MUST match the tag, and
        # match each other — otherwise the published .zip's manifest
        # version will lie about which release it is.
        #
        # The tag arrives via `env:`, never interpolated into the script
        # body: a `${{ }}` expansion inside `run:` is textual, so a tag
        # name containing shell metacharacters would execute.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          tag="$TAG"
          tag_version="${tag#v}"
          pkg_version=$(node -p "require('./package.json').version")
          mf_version=$(node -p "require('./manifest.json').version")
          echo "Tag:      $tag_version"
          echo "package:  $pkg_version"
          echo "manifest: $mf_version"
          if [ "$tag_version" != "$pkg_version" ] || [ "$tag_version" != "$mf_version" ]; then
            echo "Version mismatch. Run 'npm run version:set <version>' before tagging."
            exit 1
          fi

      - name: Build bundles
        run: npm run build

      - name: Run tests
        run: npm test

      - name: web-ext lint
        # web-ext comes from the lockfile via `npm ci`; see the note in ci.yml.
        run: npx --no-install web-ext lint --source-dir . --self-hosted

      - name: web-ext build
        run: npx --no-install web-ext build --source-dir . --artifacts-dir web-ext-artifacts --overwrite-dest

      - name: Extract changelog section for this version
        # Pull the section between this version's heading and the next
        # `## ` heading.
        #
        # Until 2026-08-09 (T3, ratified) a missing section silently
        # produced an EMPTY release body and published anyway. That is
        # the failure, not a degraded success — and it lands at the one
        # moment recovery is most expensive, since `v*` tags are
        # protected against deletion and force-update, so a bad release
        # burns a version number. Fail loudly instead.
        id: changelog
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          tag="$TAG"
          version="${tag#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no non-empty [## [$version]] section." \
                 "Add the release notes and re-run this workflow with the same tag."
            exit 1
          fi
          {
            echo "notes<<XRAYRELEASEEOF"
            echo "$notes"
            echo "XRAYRELEASEEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          files: web-ext-artifacts/*.zip
          fail_on_unmatched_files: true
