[project]
name = "xray-transcriber"
version = "0.1.0"
description = "Local YouTube transcription companion service for the X-Ray extension (yt-dlp + WhisperX + pyannote diarization)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",          # plain, NOT uvicorn[standard]
    "yt-dlp>=2026.6.30",      # deliberately loose; users update this often
    # 3.8.7rc1 is a two-change packaging release over 3.8.6 (no code
    # changes): it relaxes huggingface-hub<1.0.0 to >=0.19.0, which is
    # what unblocks transformers 5.x (see constraint-dependencies below).
    "whisperx>=3.8.7rc1",     # pulls faster-whisper, ctranslate2>=4.5, pyannote-audio>=4.0, torch~=2.8
    # torch/torchaudio/torchvision are pulled in transitively anyway, but
    # they MUST be declared here: uv only applies [tool.uv.sources] to
    # declared dependencies, and without the cu128 source the lock pins
    # PyPI's CPU-only Windows wheels.
    "torch>=2.8",
    "torchaudio>=2.8",
    "torchvision>=0.23",
]

[project.scripts]
xray-transcriber = "transcriber.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcriber"]

[tool.uv]
# Security floor, not a dependency (transformers is only pulled in
# transitively by whisperx for its alignment models): GHSA advisories
# fixed in transformers 5.0.0rc3 / 5.3.0 / 5.5.0 (RCE in Trainer, RCE,
# arbitrary code execution in LightGlue loading). Keeping the floor here
# makes a future re-lock fail loudly rather than silently regress below
# the patched version if whisperx ever re-caps huggingface-hub.
# NOTE: torch has its own advisories fixed in 2.9.1/2.10.0/2.13.0 but
# CANNOT be floored yet — every whisperx release pins torch~=2.8.0, and
# the cu128 index below tops out at torch 2.11.0 anyway.
constraint-dependencies = ["transformers>=5.5"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch       = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio  = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
