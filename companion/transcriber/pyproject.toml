[project]
name = "xray-transcriber"
version = "0.1.0"
description = "Local YouTube transcription companion service for the X-Ray extension (yt-dlp + WhisperX + pyannote diarization)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",          # plain, NOT uvicorn[standard]
    "yt-dlp>=2026.6.30",      # deliberately loose; users update this often
    # 3.8.7rc1 is a two-change packaging release over 3.8.6 (no code
    # changes): it relaxes huggingface-hub<1.0.0 to >=0.19.0, which is
    # what unblocks transformers 5.x (see constraint-dependencies below).
    "whisperx>=3.8.7rc1",     # pulls faster-whisper, ctranslate2>=4.5, pyannote-audio>=4.0, torch~=2.8 (overridden below)
    # torch/torchaudio/torchvision are pulled in transitively anyway, but
    # they MUST be declared here: uv only applies [tool.uv.sources] to
    # declared dependencies, and without the cu130 source the lock pins
    # PyPI's CPU-only Windows wheels.
    # torch floor raised 2026-08-02: < 2.13 carries three
    # memory-corruption advisories (unpack_sequence < 2.9.1,
    # lstm_cell < 2.10.0, jit.script <= 2.12.1).
    "torch>=2.13",
    "torchaudio>=2.8",
    "torchvision>=0.23",
]

[project.scripts]
xray-transcriber = "transcriber.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcriber"]

[tool.uv]
# Lock-time platform guard (added 2026-08-02 after the cu129 bump broke
# Windows): the torch indexes ship wheels only — no sdists — and their
# platform coverage varies per index (cu129 stops at torch 2.9.0 for
# win_amd64). Without this, `uv lock` on any machine happily produces a
# lock that then fails at `uv sync` on Windows — the primary deployment
# platform. With it, the lock itself fails if either platform below
# lacks wheels.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Security floor, not a dependency (transformers is only pulled in
# transitively by whisperx for its alignment models): GHSA advisories
# fixed in transformers 5.0.0rc3 / 5.3.0 / 5.5.0 (RCE in Trainer, RCE,
# arbitrary code execution in LightGlue loading). Keeping the floor here
# makes a future re-lock fail loudly rather than silently regress below
# the patched version if whisperx ever re-caps huggingface-hub.
constraint-dependencies = ["transformers>=5.5"]
# torch's own advisories (fixed in 2.9.1/2.10.0/2.13.0) needed two more
# moves beyond the transformers floor (2026-08-02): whisperx pins
# torch~=2.8.0 / torchaudio~=2.8.0 / torchvision~=0.23.0, but those are
# CI-lockstep pins, not declared incompatibilities — pyannote-audio 4.x
# is uncapped (torch>=2.8.0) and torchaudio 2.11 dropped its torch pin
# entirely — so they are OVERRIDDEN to the security floors; and the
# wheel index moves to cu130 below (the only index carrying the 2.13
# triple for BOTH win_amd64 and manylinux).
# Formally clean; functionally this runs whisperx ahead of its tested
# matrix — smoke-test one real transcription after any re-lock.
override-dependencies = [
    "torch>=2.13",
    "torchaudio>=2.11",
    "torchvision>=0.23",
]

# cu130 is the ONLY index with the 2.13 triple for Windows (verified
# against the live indexes 2026-08-02: cu129's win_amd64 torch wheels
# stop at 2.9.0, cu128's at 2.9.1 — the cu129 attempt in 5c95d3d
# resolved for manylinux only and broke `uv sync` on Windows). cu130
# builds need an NVIDIA R580+ (CUDA 13) driver — a real requirement
# bump over cu12x, already satisfied on the primary Win10/RTX 3090
# deployment box (driver 581.57, CUDA 13.0 per nvidia-smi).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch       = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio  = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
